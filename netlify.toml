[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # Skew protection. Without it, every merge to main broke the site for
  # anyone who had it open: their tab still ran the previous build's
  # JavaScript, whose files and server actions the new build no longer
  # has, so the next tap ended in "Application error: a client-side
  # exception has occurred". With it, Netlify routes each tab to the
  # build it loaded (deploy id in a cookie/header) until it reloads.
  # Read by @netlify/plugin-nextjs at build time; it uses Netlify's
  # DEPLOY_ID as Next.js's deploymentId. Safety net in lib/stale-deploy.ts.
  NETLIFY_NEXT_SKEW_PROTECTION = "true"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# The Netlify address answers with the same shop. Send visitors (and the
# links they share) to the real domain, so a seller never receives a
# "banaadir-mall.netlify.app" link that looks like phishing, and Google
# sees one address. Deploy previews have other host names and are untouched.
[[redirects]]
  from = "https://banaadir-mall.netlify.app/*"
  to = "https://www.banaadirmall.com/:splat"
  status = 301
  force = true
